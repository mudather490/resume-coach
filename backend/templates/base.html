<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resume Coach{% endblock %}</title>
  <meta name="description" content="Upload your resume PDF and chat with a coach that reviews, expands and shortens only your resume.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='m12 5 1.5 4.5L18 11l-4.5 1.5L12 17l-1.5-4.5L6 11l4.5-1.5Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  {% include "partials/icons.html" %}

  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg></span>
        <span>Resume Coach</span>
      </a>
      <nav class="nav-links" aria-label="Main">
        <a class="nav-link {% if page == 'chat' %}is-active{% endif %}" href="/chat">
          <svg class="icon" aria-hidden="true"><use href="#i-message-circle"/></svg>
          Chat
        </a>
        <a class="nav-link nav-cta" href="/upload">
          <svg class="icon" aria-hidden="true"><use href="#i-file-up"/></svg>
          Upload Resume
        </a>
      </nav>
    </div>
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">Resume Coach — answers grounded in your resume.</footer>

  {% block scripts %}{% endblock %}
</body>
</html>
